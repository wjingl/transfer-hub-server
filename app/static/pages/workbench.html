<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外发工作台 — Transfer Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
    #alert { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); z-index: 100000; }
    /* 登记条 */
    #regbar {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
      background: #161b22; border-bottom: 1px solid #30363d;
      padding: 9px 14px; color: #c9d1d9; font-size: 13px;
    }
    #regbar .grp { display: flex; gap: 6px; align-items: center; }
    #regbar label { color: #8b949e; }
    #regbar select, #regbar input[type="text"] {
      background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
      border-radius: 6px; padding: 6px 9px; font-size: 13px;
    }
    #regbar select { min-width: 120px; }
    #regbar input[type="text"] { width: 200px; }
    #regbar button {
      background: #238636; color: #fff; border: 0; border-radius: 6px;
      padding: 7px 13px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    #regbar button.sec { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    #regbar button.warn { background: #21262d; color: #d29922; border: 1px solid #9e6a03; }
    #regbar button:disabled { opacity: .45; cursor: not-allowed; }
    #regbar .fileinfo { color: #58a6ff; font-family: ui-monospace, Consolas, monospace; }
    #regbar .recstate { color: #d29922; font-weight: 600; }
    #regbar .recstate.ok { color: #3fb950; }
    /* 内核画布 */
    #hub-wrap { flex: 1 1 auto; min-height: 0; background: #0d1117; }
    #hub-frame { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div id="alert" class="alert"></div>

  <div id="regbar">
    <div class="grp">
      <label for="reg-dest">目的地</label>
      <select id="reg-dest"></select>
    </div>
    <div class="grp">
      <label for="reg-note">备注</label>
      <input id="reg-note" type="text" maxlength="200" placeholder="选填" />
    </div>
    <div class="grp">
      <span class="fileinfo" id="reg-file">在下方应用中选择文件或输入文本</span>
      <span class="recstate" id="reg-state"></span>
    </div>
    <div class="grp" style="margin-left:auto;">
      <button id="reg-main" disabled>① 登记并开始外发</button>
      <button id="reg-fail" class="warn" disabled>标记失败</button>
      <button id="reg-cancel" class="sec" disabled>取消记录</button>
    </div>
  </div>

  <div id="hub-wrap">
    <iframe id="hub-frame" src="/hub/#send" title="传输内核" allow="camera=(self)"></iframe>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/workbench.js"></script>
</body>
</html>
